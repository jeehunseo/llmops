services:
  service:
    build: .
    restart: unless-stopped
    ports:
      - "3000:8000"
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PROJECT_NAME: service
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      INFERENCE_API_URL: http://inference-api:8080
    volumes:
      - service_db:/app/data

volumes:
  service_db:

networks:
  default:
    name: llmops-net
    external: true
